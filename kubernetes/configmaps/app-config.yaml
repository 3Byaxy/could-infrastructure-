apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: cloud-infra
data:
  APP_ENV: "production"
  APP_PORT: "5000"
  LOG_LEVEL: "info"
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "cloudinfra"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  CORS_ORIGINS: "https://app.example.com"
