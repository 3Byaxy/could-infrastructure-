version: "3.9"

services:
  # ── Backend: Python Flask REST API ────────────────────────────────────────
  backend:
    build:
      context: ./backend
    container_name: cloud-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - cloud-net

  # ── Frontend: React app served by Nginx ───────────────────────────────────
  frontend:
    build:
      context: ./frontend
    container_name: cloud-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - cloud-net

networks:
  cloud-net:
    driver: bridge
