name: Notify User on Project Completion

"on":
  push:
    branches:
      - main
      - master
  pull_request:
    types:
      - closed
  workflow_dispatch:
    inputs:
      custom_message:
        description: "Optional custom message to include in the notification"
        required: false
        default: ""

jobs:
  notify:
    name: Send Completion Notification
    runs-on: ubuntu-latest
    permissions:
      contents: read      # needed to checkout the repository
      issues: write       # needed to create issues and labels
      pull-requests: read # needed to list pull requests
    # Run on push, manual dispatch, or only when a PR is merged (not just closed)
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub notification issue
        id: notify
        uses: actions/github-script@v7
        env:
          CUSTOM_MSG: ${{ github.event.inputs.custom_message }}
        with:
          script: |
            const script = require('./.github/scripts/build-notification.js');
            await script({ github, context, core });

      - name: Check email secrets availability
        id: check-email
        shell: bash
        run: |
          has_email="false"
          if [ -n "$NOTIFY_EMAIL" ] && [ -n "$MAIL_SERVER" ] && [ -n "$MAIL_USERNAME" ]; then
            has_email="true"
          fi
          echo "has_email=${has_email}" >> "$GITHUB_OUTPUT"
        env:
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}

      - name: Send email notification
        if: steps.check-email.outputs.has_email == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT || 587 }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "✅ Project Complete: ${{ steps.notify.outputs.repo_name }} is ready for review and testing"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: "GitHub Actions <${{ steps.notify.outputs.actor }}@users.noreply.github.com>"
          html_body: |
            <html>
            <body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 700px; margin: 0 auto;">
              <h2 style="color: #2ea44f;">🎉 Project Ready for Review and Testing</h2>

              <p>
                Hello <strong>@${{ steps.notify.outputs.actor }}</strong>,
              </p>
              <p>
                The <strong>
                  <a href="${{ steps.notify.outputs.repo_url }}">${{ steps.notify.outputs.repo_name }}</a>
                </strong>
                cloud-infrastructure project has been completed and is now ready for your review and testing.
              </p>

              <h3>📊 Project Status</h3>
              <ul>
                <li>✅ Design &amp; implementation complete</li>
                <li>✅ Code pushed to repository</li>
                <li>✅ Ready for review &amp; testing</li>
              </ul>

              <h3>🔗 Repository &amp; Notification</h3>
              <ul>
                <li>Repository: <a href="${{ steps.notify.outputs.repo_url }}">${{ steps.notify.outputs.repo_url }}</a></li>
                <li>Notification issue (includes PR links): <a href="${{ steps.notify.outputs.issue_url }}">${{ steps.notify.outputs.issue_url }}</a></li>
              </ul>

              <h3>🧪 Testing Instructions</h3>
              <ol>
                <li>
                  <strong>Clone the repository:</strong><br/>
                  <code>git clone ${{ steps.notify.outputs.repo_url }}.git</code>
                </li>
                <li>
                  Review the <a href="${{ steps.notify.outputs.issue_url }}">notification issue</a>
                  for a full list of pull requests and their status.
                </li>
                <li>
                  Follow the deployment instructions in <code>README.md</code>
                  to test the infrastructure.
                </li>
                <li>
                  Provide feedback by commenting on the relevant pull requests or opening new issues.
                </li>
              </ol>

              <hr style="border: 1px solid #e1e4e8;"/>
              <p style="color: #6a737d; font-size: 0.9em;">
                This notification was automatically generated by GitHub Actions on
                ${{ steps.notify.outputs.timestamp }}.
              </p>
            </body>
            </html>
