---
# Ansible inventory for cloud-infra project
# Replace placeholder IPs with your actual server IP addresses.

all:
  vars:
    ansible_user: ubuntu
    ansible_ssh_private_key_file: ~/.ssh/id_rsa
    ansible_python_interpreter: /usr/bin/python3

  children:
    webservers:
      hosts:
        web01:
          ansible_host: 10.0.1.10
        web02:
          ansible_host: 10.0.1.11

    databases:
      hosts:
        db01:
          ansible_host: 10.0.10.10

    kubernetes:
      hosts:
        k8s-control:
          ansible_host: 10.0.1.20
        k8s-worker01:
          ansible_host: 10.0.10.20
        k8s-worker02:
          ansible_host: 10.0.10.21
