# =============================================================================
# File: ansible/inventory.ini
# Language: INI format — Ansible Inventory
# What it does: Tells Ansible which servers (hosts) to connect to and
#               how to connect to them. This is like your address book.
# Maintainer: @3Byaxy
# =============================================================================

# ---------------------------------------------------------------------------
# [webservers] — group of servers that will run Nginx
# Replace the example IPs with your real server IP addresses.
# ---------------------------------------------------------------------------
[webservers]
# Local machine — useful for testing without a real remote server
localhost ansible_connection=local

# Example remote server (uncomment and fill in your details):
# 192.168.1.10 ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/my-key.pem
# 192.168.1.11 ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/my-key.pem

# ---------------------------------------------------------------------------
# [all:vars] — variables that apply to ALL hosts in this inventory
# ---------------------------------------------------------------------------
[all:vars]
# Set the Python interpreter path (important on newer Linux distros)
ansible_python_interpreter=/usr/bin/python3
