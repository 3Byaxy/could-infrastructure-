# =============================================================================
# Ansible Inventory File
# =============================================================================
# This file tells Ansible which servers to manage and how to connect to them.
#
# BEGINNER TIP: Replace the example IPs/hostnames with your real server details.
# =============================================================================

# ---- Web Servers ----
[webservers]
# Format: <hostname or IP>  ansible_user=<ssh-user>  ansible_ssh_private_key_file=<path-to-key>

# Example 1: AWS EC2 instance
# ec2-1-2-3-4.compute-1.amazonaws.com ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/my-key.pem

# Example 2: A generic Ubuntu server
# 192.168.1.10 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

# Example 3: Local testing with localhost (no SSH needed)
localhost ansible_connection=local


# ---- Database Servers (example — not used in the playbook yet) ----
[databases]
# 192.168.1.20 ansible_user=ubuntu


# ---- Group Variables ----
[webservers:vars]
ansible_python_interpreter=/usr/bin/python3
