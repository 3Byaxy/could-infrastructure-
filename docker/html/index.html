<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud Infrastructure App ☁️</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 48px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 480px;
      width: 90%;
    }
    .emoji { font-size: 64px; margin-bottom: 16px; }
    h1 { color: #2d3748; font-size: 28px; margin-bottom: 8px; }
    p { color: #718096; font-size: 16px; line-height: 1.6; margin-top: 12px; }
    .badge {
      display: inline-block;
      background: #667eea;
      color: white;
      border-radius: 20px;
      padding: 4px 16px;
      font-size: 13px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">☁️</div>
    <h1>Cloud Infrastructure</h1>
    <p>Your containerised app is running successfully!</p>
    <p>Served by Nginx inside a Docker container.</p>
    <span class="badge">🚀 Deployed with Docker</span>
  </div>
</body>
</html>
